name: Feature proposal
description: Propose a focused product or engineering improvement.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Firefox integration impact
      description: Which upstream or Mongrel-owned boundaries would change?
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, accessibility, and performance risks
