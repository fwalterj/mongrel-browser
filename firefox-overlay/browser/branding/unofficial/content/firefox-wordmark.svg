<!-- Mongrel: filename retained as firefox-wordmark.svg so all upstream
     chrome://branding/content/firefox-wordmark.svg consumers (Settings
     sidebar, about:privatebrowsing, etc.) resolve. The artwork is the
     "mongrel." lowercase wordmark with a cool-cyan period accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 99" fill="context-fill #20123a">
  <g fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Inter', sans-serif" font-weight="600" font-size="78" letter-spacing="-3.5">
    <text x="0" y="78">mongrel</text>
    <text x="282" y="78" fill="#5a6fff" font-weight="700">.</text>
  </g>
</svg>
